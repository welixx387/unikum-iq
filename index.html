<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Уникум IQ</title>
    <meta name="description" content="IQ-тест из 25–50 заданий, которые генерируются заново для каждого участника. Шкала IQ и разбор по шести способностям." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('iq-unikum:theme')
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
